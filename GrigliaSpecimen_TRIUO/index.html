<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINGs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- GRIGLIA PRINCIPALE (VISIBILE) -->
    <div class="quadrato-esterno">
        <div class="flex-container">
            <div class="item-grande pl1">
                <p class="text-grande">1</p>
            </div>
            <div class="item-grande pl2">
                <p class="text-grande">2</p>
            </div>
            <div class="item-piccolo base">
                <div class="controlli-font">
                    <label>
                        Weight:
                        <input type="range" id="slider-wght" min="300" max="700" value="500">
                    </label>

                    <label>
                        Rotation:
                        <input type="range" id="slider-rota" min="0" max="360" value="0">
                    </label>

                    <label>
                        Size:
                        <input type="range" id="slider-size" min="0" max="100" value="0">
                    </label>
                </div>
            </div>
            <div class="item-piccolo pl1">
                <p class="text-piccolo">D</p>
            </div>
            <div class="item-piccolo base">
                <div class="controlli-font2">
                    <label>
                        Weight:
                        <input type="range" id="slider-wght-2" min="300" max="700" value="500">
                    </label>

                    <label>
                        Rotation:
                        <input type="range" id="slider-rota-2" min="0" max="360" value="0">
                    </label>

                    <label>
                        Size:
                        <input type="range" id="slider-size-2" min="0" max="100" value="0">
                    </label>
                </div>
            </div>
            <div class="item-piccolo pl2">
                <p class="text-piccolo">P</p>
            </div>
            <div class="item-piccolo base campo">
                <!-- Traccia della pallina (disegnata da script.js) -->
                <canvas class="traccia-pallina" id="traccia-pallina"></canvas>
                <!-- Linea verticale tratteggiata centrale -->
                <div class="linea-centrale"></div>

                <!-- Bacchetta Rossa (Sinistra) -->
                <div class="paddle rosso" style="--pos-y: 55%;"></div>

                <!-- Bacchetta Blu (Destra) -->
                <div class="paddle blu" style="--pos-y: 25%;"></div>
            </div>
            <div class="item-lungo base">
                <p id="text-alfabeto">A B C D E F G H I J K<br> L M N O P Q R S T U V <br>W X Y Z <br>1 2 3 4 5 6 7 8 9
                    0</p>
                <p class="text-DMT">D<br>M<br>T</p>
            </div>
            <div class="item-piccolo base">
                <div class="cerchio-tratteggiato-container">
                    <div class="cerchio-tratteggiato"></div>
                    <div class="lancetta"></div>
                    <span class="testo-velocita">velocità km/h<br><strong>67</strong></span>
                </div>
            </div>

        </div>
    </div>

    <!-- PANNELLO IMPOSTAZIONI NASCOSTO (si apre/chiude con il tasto S) -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2>Impostazioni &amp; Calibrazione</h2>

            <div id="infos">
                <div>Stato: <span id="status">Caricamento OpenCV...</span></div>
                <div>WebSocket: <span id="wsStatus" style="color: orange;">Disconnesso</span></div>
                <div id="coords">Centro tracciato: X: -, Y: -</div>
            </div>

            <div id="controls-panel">
                <button id="detect-matrix" type="button">Rileva matrice</button>
                <div id="color-slots-container">
                    <div id="color-slot-1"></div>
                    <div id="color-slot-2"></div>
                </div>
                <div class="control-group">
                    <label>Tolleranza Hue: <span id="hue-tol-val">10</span></label>
                    <input type="range" id="hue-tol" min="1" max="40" value="10">
                </div>
                <div class="control-group">
                    <label>Sat Min: <span id="sat-min-val">80</span></label>
                    <input type="range" id="sat-min" min="0" max="255" value="80">
                </div>
                <div class="control-group">
                    <label>Val Min: <span id="val-min-val">80</span></label>
                    <input type="range" id="val-min" min="0" max="255" value="80">
                </div>
            </div>

            <div id="pick-hint" hidden>Clicca sul video per campionare il colore</div>

            <div id="container-video">
                <video id="video" width="640" height="480" autoplay playsinline muted style="display:none;"></video>
                <canvas id="canvas" width="640" height="480"></canvas>
            </div>
        </div>
        <div class="settings-close-hint">Premi il tasto <strong>S</strong> per chiudere</div>
    </div>

    <!-- ORDINE IMPORTANTE: tracking.js prima di OpenCV, script.js per ultimo -->
    <script src="tracking.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady();"></script>
    <script src="script.js"></script>
</body>

</html>
